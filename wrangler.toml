name = "proxycontroller"
main = "src/index.js"
compatibility_date = "2026-06-03"

# 告诉 Cloudflare 这是一个普通的 Worker
workers_dev = true

# 声明代码中用到的环境变量（用户在部署页面或稍后可以修改）
[vars]
WEB_USER = "qwez007"
WEB_PASS = "q39978581"
PROXY_USER = "proxy"
PROXY_PASS = "q39978581"

# 声明 D1 数据库绑定
[[d1_databases]]
